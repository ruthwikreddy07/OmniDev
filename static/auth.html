<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmniDev — Sign In</title>
<link rel="stylesheet" href="/static/aurora.css">
<style>
.auth-page {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 32px; position: relative;
}
.auth-glow {
  position: absolute; top: 30%; left: 50%; transform: translateX(-50%);
  width: 500px; height: 400px;
  background: radial-gradient(ellipse, rgba(124,92,252,0.15) 0%, transparent 70%);
  filter: blur(80px); pointer-events: none;
}
.auth-container {
  width: 100%; max-width: 420px; position: relative; z-index: 2;
  animation: fadeInUp 0.6s var(--ease-out) both;
}
.auth-header { text-align: center; margin-bottom: 36px; }
.auth-logo {
  width: 48px; height: 48px; border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--accent), #00d4aa);
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 20px; color: #fff;
  box-shadow: 0 0 30px rgba(124,92,252,0.3);
  margin-bottom: 20px;
}
.auth-header h1 {
  font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px;
}
.auth-header p { font-size: 14px; color: var(--text-secondary); }
.auth-card {
  background: rgba(15,18,25,0.8);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
  padding: 36px; box-shadow: var(--shadow-lg);
}
.auth-tabs {
  display: flex; background: var(--surface-0); border-radius: var(--radius-sm);
  padding: 4px; margin-bottom: 28px; border: 1px solid var(--border-subtle);
}
.auth-tab {
  flex: 1; padding: 10px; border: none; border-radius: 6px;
  font-family: var(--font-sans); font-size: 13.5px; font-weight: 600;
  color: var(--text-secondary); background: transparent;
  cursor: pointer; transition: all var(--transition-fast);
}
.auth-tab.active { background: var(--surface-3); color: var(--text-primary); }
.auth-tab:hover:not(.active) { color: var(--text-primary); }
.form-group { margin-bottom: 20px; }
.form-label {
  display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary);
  margin-bottom: 8px;
}
.form-input {
  width: 100%; padding: 12px 16px;
  background: var(--surface-0); border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); color: var(--text-primary);
  font-family: var(--font-sans); font-size: 14px;
  outline: none; transition: all var(--transition-fast);
}
.form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.form-input::placeholder { color: var(--text-tertiary); }
.form-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.form-check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-secondary); cursor: pointer; }
.form-check input[type="checkbox"] {
  width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer;
}
.form-link { font-size: 13px; color: var(--accent); font-weight: 500; }
.form-link:hover { color: #9b82fc; }
.auth-submit {
  width: 100%; padding: 13px; border: none; border-radius: var(--radius-sm);
  background: var(--accent); color: #fff;
  font-family: var(--font-sans); font-size: 14.5px; font-weight: 700;
  cursor: pointer; transition: all var(--transition-fast);
  box-shadow: 0 0 20px rgba(124,92,252,0.25);
}
.auth-submit:hover {
  background: #8d6ffd; box-shadow: 0 0 30px rgba(124,92,252,0.4);
  transform: translateY(-1px);
}
.auth-divider {
  display: flex; align-items: center; gap: 16px;
  margin: 24px 0; color: var(--text-tertiary); font-size: 12px;
}
.auth-divider::before, .auth-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border-subtle);
}
.social-buttons { display: flex; gap: 12px; }
.social-btn {
  flex: 1; padding: 11px; border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm); background: var(--surface-1);
  color: var(--text-secondary); font-family: var(--font-sans); font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all var(--transition-fast);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.social-btn:hover { background: var(--surface-2); border-color: var(--border-mid); color: var(--text-primary); }
.social-btn svg { width: 18px; height: 18px; }
.auth-footer { text-align: center; margin-top: 24px; font-size: 13px; color: var(--text-secondary); }
.auth-panel-signup { display: none; }
</style>
</head>
<body>

<canvas id="aurora-bg"></canvas>
<div class="aurora-mesh">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>
</div>

<div class="page-wrapper">
  <nav class="topbar">
    <a href="/" class="topbar-brand">
      <div class="brand-icon">O</div>
      <span class="brand-name">OmniDev</span>
    </a>
    <div class="topbar-nav"></div>
    <div class="topbar-actions">
      <a href="/" class="btn btn-ghost btn-sm">← Back Home</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-glow"></div>
    <div class="auth-container">
      <div class="auth-header">
        <div class="auth-logo">O</div>
        <h1 class="text-gradient">Welcome back</h1>
        <p>Sign in to your OmniDev workspace</p>
      </div>

      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" onclick="switchTab('login')">Sign In</button>
          <button class="auth-tab" onclick="switchTab('signup')">Create Account</button>
        </div>

        <div id="panel-login" class="auth-panel-login">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" placeholder="you@company.com">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" placeholder="••••••••">
          </div>
          <div class="form-row">
            <label class="form-check">
              <input type="checkbox" checked> Remember me
            </label>
            <a href="#" class="form-link">Forgot password?</a>
          </div>
          <button class="auth-submit" onclick="handleAuth()">Sign In</button>
        </div>

        <div id="panel-signup" class="auth-panel-signup">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" placeholder="Jane Doe">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" placeholder="you@company.com">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" placeholder="Min 8 characters">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-input" placeholder="••••••••">
          </div>
          <button class="auth-submit" onclick="handleAuth()">Create Account</button>
        </div>

        <div class="auth-divider">or continue with</div>

        <div class="social-buttons">
          <button class="social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
            GitHub
          </button>
          <button class="social-btn">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Google
          </button>
        </div>
      </div>

      <div class="auth-footer">
        By continuing, you agree to OmniDev's Terms and Privacy Policy.
      </div>
    </div>
  </div>
</div>

<script src="/static/aurora-canvas.js"></script>
<script>
function switchTab(tab) {
  document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'login') {
    document.querySelectorAll('.auth-tab')[0].classList.add('active');
    document.getElementById('panel-login').style.display = 'block';
    document.getElementById('panel-signup').style.display = 'none';
    document.querySelector('.auth-header h1').textContent = 'Welcome back';
    document.querySelector('.auth-header p').textContent = 'Sign in to your OmniDev workspace';
  } else {
    document.querySelectorAll('.auth-tab')[1].classList.add('active');
    document.getElementById('panel-login').style.display = 'none';
    document.getElementById('panel-signup').style.display = 'block';
    document.querySelector('.auth-header h1').textContent = 'Create account';
    document.querySelector('.auth-header p').textContent = 'Start your autonomous engineering journey';
  }
}

function handleAuth() {
  const btn = document.querySelector('.auth-submit');
  const original = btn.textContent;
  btn.innerHTML = '<span class="spinner" style="display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;"></span>';
  btn.style.pointerEvents = 'none';
  setTimeout(() => { window.location.href = '/console'; }, 1200);
}
</script>
</body>
</html>
